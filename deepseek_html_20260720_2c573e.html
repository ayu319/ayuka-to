
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>悪いよカート (調整版)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-container {
            position: absolute; top: 15px; left: 15px; color: white; font-weight: bold;
            background: rgba(0,0,0,0.65); padding: 12px 16px; border-radius: 10px; pointer-events: none;
            z-index: 10; font-size: 15px; min-width: 160px;
        }
        #rank-text { font-size: 26px; color: #ffeb3b; }
        #lap-text { font-size: 18px; margin-top: 2px; }
        #coin-text { font-size: 18px; color: #fff33f; margin-top: 2px; }
        #status-text { font-size: 13px; color: #ffeb3b; margin-top: 2px; }
        #warning-text {
            font-size: 18px;
            margin-top: 4px;
            text-shadow: 0 0 15px currentColor;
            font-weight: bold;
            min-height: 26px;
            transition: color 0.1s;
        }
        #countdown {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 72px; font-weight: bold; color: #fff; text-shadow: 4px 4px 0px #000;
            pointer-events: none; text-align: center; z-index: 10; width: 80%;
        }
        #turbo-ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            font-size: 24px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000;
            text-align: center; pointer-events: none; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 4px 16px; border-radius: 20px;
        }
        .item-box-ui {
            position: absolute; top: 15px; width: 80px; height: 80px;
            background: rgba(0,0,0,0.7); border: 3px solid #ffeb3b; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; color: white;
            font-size: 12px; font-weight: bold; text-align: center; pointer-events: none;
            z-index: 10;
        }
        #item-slot-1 { right: 110px; border-color: #ffeb3b; }
        #item-slot-2 { right: 15px; border-color: #888; background: rgba(0,0,0,0.8); }
        #audio-hint { position: absolute; bottom: 8px; right: 12px; color: rgba(255,255,255,0.35); font-size: 11px; pointer-events: none; z-index: 10; }
        #charge-bar {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 180px; height: 18px; background: rgba(0,0,0,0.7); border: 2px solid #fff;
            border-radius: 10px; overflow: hidden; display: none; z-index: 10;
        }
        #charge-fill {
            width: 0%; height: 100%; background: linear-gradient(90deg, #ff4400, #ff8800, #ffff00);
            transition: width 0.05s;
        }
        .triple-indicator {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; font-size: 26px; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 10px;
        }
        #debug-stats {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #0f0; font-size: 14px; font-weight: bold; text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.6); padding: 4px 16px; border-radius: 20px;
            border: 1px solid rgba(0,255,0,0.3); z-index: 20; pointer-events: none;
            font-family: 'Courier New', monospace;
            text-align: center;
        }
        #jump-count {
            position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
            color: #ff66ff; font-size: 18px; font-weight: bold;
            text-shadow: 0 0 20px #ff66ff, 0 0 40px #ff00ff;
            background: rgba(0,0,0,0.5); padding: 4px 16px; border-radius: 20px;
            pointer-events: none; z-index: 10;
            border: 2px solid #ff66ff;
            display: none;
        }
        #weight-display {
            position: absolute; top: 185px; left: 15px;
            color: white; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 6px;
            pointer-events: none; z-index: 10;
            border-left: 3px solid #ffaa00;
        }
        .weight-legend {
            position: absolute; top: 218px; left: 15px;
            color: #ddd; font-size: 11px;
            background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 6px;
            pointer-events: none; z-index: 10;
            line-height: 1.4;
        }
        .weight-legend span { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .legend-blue { background: #3388ff; }
        .legend-yellow { background: #ffcc00; }
        .legend-red { background: #ff3333; }
        .legend-white { background: #ffd700; }
        #race-lock-msg {
            position: absolute; top: 105px; left: 50%; transform: translateX(-50%);
            color: #ff4444; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.7); padding: 4px 16px; border-radius: 20px;
            pointer-events: none; z-index: 10;
            border: 2px solid #ff4444;
            display: none;
        }
        /* ★ 青甲羅警告 (小さく、スローモーションなし) */
        #blue-shell-warning {
            position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
            font-size: 32px; font-weight: bold;
            color: #ff4488; text-shadow: 0 0 20px #ff0066, 0 0 40px #ff0044;
            background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 16px;
            pointer-events: none; z-index: 20;
            border: 2px solid #ff4488;
            text-align: center;
            display: none;
            backdrop-filter: blur(2px);
            letter-spacing: 2px;
        }
        #blue-shell-sub {
            font-size: 18px;
            color: #ffaa88;
            margin-top: 2px;
            text-shadow: 0 0 10px #ff4400;
            font-weight: normal;
        }
        /* 通常の飛来警告は右上に小さく */
        #incoming-warning {
            position: absolute; top: 100px; right: 20px;
            color: #ffaa00; font-size: 16px; font-weight: bold;
            text-shadow: 0 0 20px #ff8800;
            background: rgba(0,0,0,0.75); padding: 6px 16px; border-radius: 20px;
            pointer-events: none; z-index: 15;
            border: 1px solid #ff8800;
            text-align: center;
            min-width: 140px;
            display: none;
            backdrop-filter: blur(2px);
        }
        #incoming-sub {
            font-size: 13px;
            color: #ffcc66;
            margin-top: 2px;
        }
        /* ランク強調 */
        #rank-text.rank-warning {
            color: #ff4488;
            text-shadow: 0 0 15px #ff0066;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="rank-text">順位: --</div>
        <div id="lap-text">Lap: --</div>
        <div id="coin-text">🪙 コイン: 0/10</div>
        <div id="status-text">黄色のエリアへ向かおう！</div>
        <div id="warning-text"></div>
    </div>
    <div id="item-slot-1" class="item-box-ui">ITEM 1<br>なし</div>
    <div id="item-slot-2" class="item-box-ui">ITEM 2<br>なし</div>
    <div id="countdown"></div>
    <div id="turbo-ui"></div>
    <div id="charge-bar"><div id="charge-fill"></div></div>
    <div id="audio-hint">※画面クリックで音有効</div>
    <div class="triple-indicator" id="triple-indicator" style="display:none;"></div>
    <div id="debug-stats">FPS: -- | 最寄NPC: --</div>
    <div id="jump-count">✨ ジャンプアクション: 0回 ✨</div>
    <div id="weight-display">⚖️ あなた: 普通</div>
    <div id="race-lock-msg">🔒 レース中は変更できません</div>
    <!-- ★ 青甲羅警告 (小さめ) -->
    <div id="blue-shell-warning">
        <div>💙 青甲羅が迫る！</div>
        <div id="blue-shell-sub">⚠️ 回避！ ⚠️</div>
    </div>
    <!-- 通常飛来警告 (右上) -->
    <div id="incoming-warning">
        <div id="incoming-main">⚠️ 飛来物</div>
        <div id="incoming-sub">🟢 緑甲羅 まで 23m</div>
    </div>
    <div class="weight-legend">
        <div><span class="legend-blue"></span>軽い (加速◎ 最高速△)</div>
        <div><span class="legend-yellow"></span>普通 (バランス)</div>
        <div><span class="legend-red"></span>重い (加速△ 最高速◎)</div>
        <div><span class="legend-white"></span>あなた (Qで変更)</div>
    </div>

<script>
// --- FPS上限120に設定 ---
const TARGET_FPS = 70;
const FRAME_INTERVAL = 1000 / TARGET_FPS;
let lastFrameTime = 0;

// --- 🔊 WEB AUDIO API ---
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

window.addEventListener('click', () => { initAudio(); });
window.addEventListener('keydown', () => { initAudio(); });

function playTone(freq, duration, type='sine', volume=0.1) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function soundCount() { playTone(440, 0.1, 'sine', 0.15); }
function soundGo() { playTone(880, 0.4, 'sine', 0.2); startBGM(); }
function soundItem() {
    playTone(523.25, 0.05, 'sine', 0.15);
    setTimeout(() => playTone(659.25, 0.05, 'sine', 0.15), 50);
    setTimeout(() => playTone(783.99, 0.15, 'sine', 0.15), 100);
}
function soundBoost() {
    playTone(330, 0.04, 'sawtooth', 0.08);
    setTimeout(() => playTone(440, 0.04, 'sawtooth', 0.08), 40);
    setTimeout(() => playTone(554.37, 0.04, 'sawtooth', 0.08), 80);
    setTimeout(() => playTone(659.25, 0.12, 'sawtooth', 0.08), 120);
}
function soundHit() {
    playTone(120, 0.25, 'sawtooth', 0.25);
    playTone(90, 0.3, 'triangle', 0.3);
}
function soundBlueShell() {
    playTone(200, 0.3, 'sawtooth', 0.2);
    setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.3), 100);
}
function soundFireball() {
    playTone(800, 0.05, 'sawtooth', 0.08);
    setTimeout(() => playTone(600, 0.04, 'sawtooth', 0.06), 20);
}
function soundBomb() {
    playTone(300, 0.15, 'sawtooth', 0.15);
    setTimeout(() => playTone(200, 0.2, 'sawtooth', 0.2), 80);
}
function soundCrash() {
    playTone(180, 0.15, 'sawtooth', 0.2);
    setTimeout(() => playTone(120, 0.2, 'sawtooth', 0.25), 80);
}

function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    let step = 0;
    const bassNodes = [110, 110, 130, 110, 146, 146, 165, 130];
    bgmInterval = setInterval(() => {
        if (raceState !== 2) { if(raceState === 3) clearInterval(bgmInterval); return; }
        let f = bassNodes[step % bassNodes.length];
        playTone(f, 0.13, 'triangle', 0.18);
        if (step % 2 === 0) {
            let mel = [440, 493.88, 523.25, 587.33, 659.25, 587.33, 523.25, 493.88];
            playTone(mel[(step / 2) % mel.length], 0.07, 'square', 0.02);
        }
        step++;
    }, 160);
}


// --- 🎮 3Dメインゲームシステム ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x557799);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xfffcaa, 0.8); dirLight.position.set(100, 400, 100); scene.add(dirLight);

// 地面
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0x2d2822 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// --- コース (簡略化) ---
const TRACK_WIDTH = 80;
const trackPieces = new THREE.Group();
const roadMat = new THREE.MeshStandardMaterial({ color: 0x383840, roughness: 0.7 });
const roadStart = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_WIDTH, 400), roadMat); roadStart.rotation.x = -Math.PI/2; roadStart.position.set(0, 0.02, 100); trackPieces.add(roadStart);
const roadLeft1 = new THREE.Mesh(new THREE.PlaneGeometry(300, TRACK_WIDTH), roadMat); roadLeft1.rotation.x = -Math.PI/2; roadLeft1.position.set(-150, 0.02, -200); trackPieces.add(roadLeft1);
const roadCurve1 = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_WIDTH, 200), roadMat); roadCurve1.rotation.x = -Math.PI/2; roadCurve1.position.set(-300, 0.02, -300); trackPieces.add(roadCurve1);
const roadCurve2 = new THREE.Mesh(new THREE.PlaneGeometry(200, TRACK_WIDTH), roadMat); roadCurve2.rotation.x = -Math.PI/2; roadCurve2.position.set(-200, 0.02, -400); trackPieces.add(roadCurve2);
const roadRight1 = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_WIDTH, 300), roadMat); roadRight1.rotation.x = -Math.PI/2; roadRight1.position.set(350, 0.02, -250); trackPieces.add(roadRight1);
const roadRight2 = new THREE.Mesh(new THREE.PlaneGeometry(150, TRACK_WIDTH), roadMat); roadRight2.rotation.x = -Math.PI/2; roadRight2.position.set(275, 0.02, -100); trackPieces.add(roadRight2);
const roadRight3 = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_WIDTH, 350), roadMat); roadRight3.rotation.x = -Math.PI/2; roadRight3.position.set(200, 0.02, 75); trackPieces.add(roadRight3);
const roadBackToStart = new THREE.Mesh(new THREE.PlaneGeometry(200, TRACK_WIDTH), roadMat); roadBackToStart.rotation.x = -Math.PI/2; roadBackToStart.position.set(100, 0.02, 250); trackPieces.add(roadBackToStart);
scene.add(trackPieces);

// ゴールライン
const finishLineGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 10);
const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 32;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,256,32); ctx.fillStyle = '#000000';
for(let i=0; i<16; i++) { for(let j=0; j<2; j++) { if((i+j)%2===0) ctx.fillRect(i*16, j*16, 16, 16); } }
const finishText = new THREE.CanvasTexture(canvas);
const finishLine = new THREE.Mesh(finishLineGeo, new THREE.MeshBasicMaterial({ map: finishText, side: THREE.DoubleSide }));
finishLine.rotation.x = -Math.PI/2; finishLine.position.set(0, 0.06, 50); scene.add(finishLine);

// エントリーゾーン
const entryZoneGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 40);
const entryZoneMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
const entryZone = new THREE.Mesh(entryZoneGeo, entryZoneMat);
entryZone.rotation.x = -Math.PI / 2;
entryZone.position.set(0, 0.05, 110);
scene.add(entryZone);

// 工場エリア
const factoryGroup = new THREE.Group();
const FACTORY_WIDTH = 50;
const insideFloor = new THREE.Mesh(new THREE.PlaneGeometry(FACTORY_WIDTH, 200), new THREE.MeshStandardMaterial({ color: 0x1c1c22 }));
insideFloor.rotation.x = -Math.PI / 2; insideFloor.position.set(0, 0.04, -50); factoryGroup.add(insideFloor);
const roof = new THREE.Mesh(new THREE.BoxGeometry(FACTORY_WIDTH, 3, 200), new THREE.MeshStandardMaterial({ color: 0x15151a }));
roof.position.set(0, 50, -50); factoryGroup.add(roof);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x4f4f5d });
const RIGHT_WALL_X = FACTORY_WIDTH / 2; const LEFT_WALL_X = -FACTORY_WIDTH / 2;
const rightWall = new THREE.Mesh(new THREE.BoxGeometry(4, 50, 200), wallMat); rightWall.position.set(RIGHT_WALL_X, 25, -50); factoryGroup.add(rightWall);
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(4, 50, 200), wallMat); leftWall.position.set(LEFT_WALL_X, 25, -50); factoryGroup.add(leftWall);
const alertLight = new THREE.PointLight(0xff0000, 1.5, 150); alertLight.position.set(0, 45, -50); factoryGroup.add(alertLight);
scene.add(factoryGroup);

// ポール
const poleGeometry = new THREE.CylinderGeometry(3.5, 3.5, 70, 16);
const poleMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 });
const pole1Group = new THREE.Group();
pole1Group.position.set(12, 0, -250);
const pole1Mesh = new THREE.Mesh(poleGeometry, poleMaterial);
pole1Mesh.position.y = 35;
pole1Group.add(pole1Mesh);
for(let h=5; h<=65; h+=10) {
    const blueMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.4 });
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 3.7, 5, 16), blueMat);
    ring.position.y = h - 35;
    pole1Mesh.add(ring);
}
scene.add(pole1Group);
const pole2Group = new THREE.Group();
pole2Group.position.set(-12, 0, -250);
const pole2Mesh = new THREE.Mesh(poleGeometry, poleMaterial);
pole2Mesh.position.y = 35;
pole2Group.add(pole2Mesh);
for(let h=5; h<=65; h+=10) {
    const blueMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.4 });
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 3.7, 5, 16), blueMat);
    ring.position.y = h - 35;
    pole2Mesh.add(ring);
}
scene.add(pole2Group);

// ギミック
const gearGroup = new THREE.Group(); gearGroup.position.set(-140, 55, -80);
const gearCenter = new THREE.Mesh(new THREE.CylinderGeometry(25, 25, 10, 16), new THREE.MeshStandardMaterial({color: 0x555561, roughness: 0.5}));
gearCenter.rotation.x = Math.PI/2; gearGroup.add(gearCenter);
for(let i=0; i<12; i++) {
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 14), new THREE.MeshStandardMaterial({color: 0x3d3d47}));
    tooth.position.set(Math.cos(i*Math.PI/6)*28, Math.sin(i*Math.PI/6)*28, 0); tooth.rotation.z = i*Math.PI/6; gearGroup.add(tooth);
}
scene.add(gearGroup);

// 縁石・水・ジャンプ台
const curbMatW = new THREE.MeshStandardMaterial({color: 0xeeeeee, roughness: 0.5});
const curbMatR = new THREE.MeshStandardMaterial({color: 0xff2222, roughness: 0.5});
for(let i=0; i<14; i++) {
    const curb = new THREE.Mesh(new THREE.BoxGeometry(16, 2, 6), (i%2===0?curbMatW:curbMatR));
    curb.position.set(-350, 0.6, -360 + i*16); scene.add(curb);
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(450, 150), new THREE.MeshStandardMaterial({ color: 0x0044cc, roughness: 0.1 }));
water.rotation.x = -Math.PI / 2; water.position.set(150, -1.0, -400); scene.add(water);
const ramp = new THREE.Mesh(new THREE.BoxGeometry(60, 5, 45), new THREE.MeshStandardMaterial({ color: 0xff1111, roughness: 0.4 }));
ramp.position.set(-90, 1.0, -400); ramp.rotation.z = 0.15; scene.add(ramp);
const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x7c4c24, roughness: 0.8 });
const bridge1 = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 50), bridgeMat); bridge1.position.set(0, -1, -400); scene.add(bridge1);
const bridge2 = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 50), bridgeMat); bridge2.position.set(125, -1, -400); scene.add(bridge2);
const bridge3 = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 50), bridgeMat); bridge3.position.set(250, -1, -400); scene.add(bridge3);
const smallRampMat = new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.4 });
const smallRamp1 = new THREE.Mesh(new THREE.BoxGeometry(20, 2.5, 30), smallRampMat); smallRamp1.position.set(20, -0.2, -400); smallRamp1.rotation.z = 0.2; scene.add(smallRamp1);
const smallRamp2 = new THREE.Mesh(new THREE.BoxGeometry(20, 2.5, 30), smallRampMat); smallRamp2.position.set(145, -0.2, -400); smallRamp2.rotation.z = 0.2; scene.add(smallRamp2);

// プレイヤーカート
const carGroup = new THREE.Group();
const carModel = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1, 3.4), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
carModel.position.y = 0.5;
carGroup.add(carModel);
scene.add(carGroup);

// ★ プレイヤーの重さ設定
let playerWeight = "普通";
const weightStats = {
    "軽い": { maxSpeedMul: 0.85, accelMul: 1.3, mass: 0.6, label: "⚖️ 軽い 🏃💨", color: 0x3388ff },
    "普通": { maxSpeedMul: 1.0, accelMul: 1.0, mass: 1.0, label: "⚖️ 普通", color: 0xffcc00 },
    "重い": { maxSpeedMul: 1.25, accelMul: 0.7, mass: 1.6, label: "⚖️ 重い 🦍", color: 0xff3333 }
};
let weightIndex = 1;
const weightKeys = ["軽い", "普通", "重い"];
let isRaceLocked = false;

function updatePlayerColor() {
    const color = weightStats[playerWeight].color;
    carModel.material.color.setHex(color);
    document.getElementById("weight-display").textContent = `⚖️ あなた: ${playerWeight}`;
}

const sparkLeft = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), new THREE.MeshBasicMaterial({color: 0xff4500, visible: false})); sparkLeft.position.set(-1.3, 0.2, 1.5); carGroup.add(sparkLeft);
const sparkRight = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), new THREE.MeshBasicMaterial({color: 0xff4500, visible: false})); sparkRight.position.set(1.3, 0.2, 1.5); carGroup.add(sparkRight);

// --- ★ NPC (重さランダム＆色分け) ---
const weightTypes = ["軽い", "普通", "重い"];
const weightColors = {
    "軽い": 0x3388ff,
    "普通": 0xffcc00,
    "重い": 0xff3333
};

const npcs = [];
for (let i = 0; i < 11; i++) {
    const weight = weightTypes[Math.floor(Math.random() * weightTypes.length)];
    const stats = weightStats[weight];
    const color = weightColors[weight];

const npcPathNodes = [
    {x: 0, z: 300}, {x: 0, z: 0}, {x: 0, z: -200}, {x: -300, z: -200}, {x: -300, z: -400}, {x: -100, z: -400}, {x: -90, z: -400},

];
const NODE_COUNT = npcPathNodes.length;
let totalTrackLength = 0;
let segmentLengths = [];

function initTrackLengths() {
    totalTrackLength = 0;
    segmentLengths = [];
    for (let i = 0; i < NODE_COUNT; i++) {
        let p1 = npcPathNodes[i];
        let p2 = npcPathNodes[(i + 1) % NODE_COUNT];
        let dx = p2.x - p1.x;
        let dz = p2.z - p1.z;
        let len = Math.sqrt(dx*dx + dz*dz);
        segmentLengths.push(len);
        totalTrackLength += len;
    }
}
initTrackLengths();

let lastPlayerSegment = 0;
function calculatePlayerProgress() {
    let bestDist = Infinity;
    let bestProgress = 0;
    let bestSegment = lastPlayerSegment;
    const px = carGroup.position.x;
    const pz = carGroup.position.z;
    const WINDOW = 7;
    for (let offset = -WINDOW; offset <= WINDOW; offset++) {
        let i = ((lastPlayerSegment + offset) % NODE_COUNT + NODE_COUNT) % NODE_COUNT;
        let p1 = npcPathNodes[i];
        let p2 = npcPathNodes[(i + 1) % NODE_COUNT];
        let len = segmentLengths[i];
        let t = 0;
        if (len > 0) {
            t = ((px - p1.x) * (p2.x - p1.x) + (pz - p1.z) * (p2.z - p1.z)) / (len * len);
            t = Math.max(0, Math.min(1, t));
        }
        let projX = p1.x + t * (p2.x - p1.x);
        let projZ = p1.z + t * (p2.z - p1.z);
        let dist = Math.sqrt((px - projX)**2 + (pz - projZ)**2);
        if (dist < bestDist) {
            bestDist = dist;
            bestSegment = i;
            let accumulatedLength = 0;
            for (let k = 0; k < i; k++) accumulatedLength += segmentLengths[k];
            bestProgress = (accumulatedLength + t * len) / totalTrackLength;
        }
    }
    lastPlayerSegment = bestSegment;
    return bestProgress;
}

    shells.forEach(s => {
        if (!s.mesh) return;
        if (s.isPlayerOwned) return;
        const dist = playerPos.distanceTo(s.mesh.position);
        if (dist < 200) {
            let type = "甲羅";
            let emoji = "🟢";
            if (s.type === "red" || s.type === "red_to_player") emoji = "🔴";
            else if (s.type === "blue") {
                emoji = "💙";
                if (s.target === carGroup || s.target === carGroup.mesh) {
                    hasBlueShellTargetingPlayer = true;
                }
            } else emoji = "🟢";
            allProjectiles.push({ 
                type: emoji + type, 
                distance: dist, 
                pos: s.mesh.position.clone(),
                rawType: s.type,
                isBlueTargetingPlayer: (s.type === "blue" && (s.target === carGroup || s.target === carGroup.mesh))
            });
        }
    });
    
    // 火の玉 (自分が投げたものは除外)
    fireballs.forEach(fb => {
        if (!fb.mesh) return;
        if (fb.isPlayerOwned) return;
        const dist = playerPos.distanceTo(fb.mesh.position);
        if (dist < 200) {
            allProjectiles.push({ 
                type: "🔥火の玉", 
                distance: dist, 
                pos: fb.mesh.position.clone(),
                rawType: "fireball",
                isBlueTargetingPlayer: false
            });
        }
    });
    
    // ボム (自分が投げたものは除外)
    bombs.forEach(b => {
        if (!b.mesh) return;
        if (b.isPlayerOwned) return;
        const dist = playerPos.distanceTo(b.mesh.position);
        if (dist < 200) {
            allProjectiles.push({ 
                type: "💣ボム", 
                distance: dist, 
                pos: b.mesh.position.clone(),
                rawType: "bomb",
                isBlueTargetingPlayer: false
            });
        }
    });
    
    // ★ 青甲羅警告 (中央、小さめ)
    if (hasBlueShellTargetingPlayer) {
        blueShellEl.style.display = 'block';
        const blueShell = allProjectiles.find(p => p.isBlueTargetingPlayer);
        if (blueShell) {
            blueShellSub.textContent = `⚠️ まで ${Math.round(blueShell.distance)}m`;
        } else {
            blueShellSub.textContent = '⚠️ 回避！ ⚠️';
        }
        document.getElementById('rank-text').classList.add('rank-warning');
    } else {
        blueShellEl.style.display = 'none';
        document.getElementById('rank-text').classList.remove('rank-warning');
    }
    
    // 右上の通常警告 (青甲羅以外)
    const nonBlue = allProjectiles.filter(p => !p.isBlueTargetingPlayer);
    nonBlue.sort((a,b) => a.distance - b.distance);
    
    if (nonBlue.length > 0) {
        const nearest = nonBlue[0];
        incomingEl.style.display = 'block';
        incomingMain.textContent = `⚠️ ${nearest.type} 接近！`;
        incomingSub.textContent = `📏 まで ${Math.round(nearest.distance)}m (${nonBlue.length}個)`;
    } else {
        incomingEl.style.display = 'none';
    }
}

// ★ 青甲羅のターゲット: 1位を狙う (自分が1位なら自分)
function getBlueShellTarget() {
    if (getPlayerRank() === 1) {
        return carGroup;
    }
    let bestNpc = null;
    let bestProgress = -Infinity;
    for (let npc of npcs) {
        let prog = npc.lap + npc.progress;
        if (prog > bestProgress) {
            bestProgress = prog;
            bestNpc = npc;
        }
    }
    return bestNpc ? bestNpc.mesh : carGroup;
}

function updateBombCharge() {
    if (isChargingBomb && (keys.shift || keys.z)) {
        bombChargeTime = Math.min(bombChargeTime + 1, bombChargeMax);
        const ratio = bombChargeTime / bombChargeMax;
        document.getElementById("charge-fill").style.width = (ratio * 100) + "%";
        const turboText = document.getElementById("turbo-ui");
        const dir = keys.z ? "背面" : "前方";
        turboText.innerText = `💣 ${dir}チャージ中... ${Math.round(ratio * 100)}%`;
        turboText.style.color = "#ff8800";
    }
}

// ★ NPCがアイテムを使う
function useNpcItem(npc) {
    if (!npc.heldItem) return;
    const item = npc.heldItem; npc.heldItem = null;
    
    if (item === "緑甲羅") {
        const sm = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x33cc33 }));
        sm.position.copy(npc.mesh.position).y += 0.5;
        const dir = new THREE.Vector3()
            .subVectors(carGroup.position, npc.mesh.position)
            .normalize();
        const angleOffset = (Math.random() - 0.5) * 0.8;
        const rot = new THREE.Matrix4().makeRotationY(angleOffset);
        dir.applyMatrix4(rot);
        sm.position.addScaledVector(dir, 4.0);
        scene.add(sm);
        shells.push({ mesh: sm, dir: dir, type: "green", life: 250, velocityY: 0, speedMul: 2.8 + Math.random() * 0.5, isPlayerOwned: false });
        showShellWarning("🟢 緑甲羅が飛んでくる！避けて！", "#33cc33");
        return;
    }
    
    if (item === "ファイヤーフラワー") {
        for (let i = 0; i < 2; i++) {
            setTimeout(() => {
                const fireMat = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 0.8 });
                const fireMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 10), fireMat);
                fireMesh.position.copy(npc.mesh.position);
                fireMesh.position.y += 0.4;
                const dir = new THREE.Vector3()
                    .subVectors(carGroup.position, npc.mesh.position)
                    .normalize();
                const angleOffset = (Math.random() - 0.5) * 1.2;
                const rot = new THREE.Matrix4().makeRotationY(angleOffset);
                dir.applyMatrix4(rot);
                fireMesh.position.addScaledVector(dir, 3.0);
                scene.add(fireMesh);
                fireballs.push({ 
                    mesh: fireMesh, 
                    direction: dir, 
                    life: 120, 
                    speed: 5.0 + Math.random() * 1.5, 
                    bounces: 0, 
                    maxBounces: 1, 
                    trail: [], 
                    trailCounter: 0, 
                    isNpc: true, 
                    ownerNpc: npc,
                    gravity: 0.03,
                    vy: 0.1 + Math.random() * 0.1,
                    isPlayerOwned: false
                });
                soundFireball();
            }, i * 100);
        }
        showShellWarning("🔥 火の玉が飛んでくる！", "#ff6600");
        return;
    }
    
    if (item === "ボム兵") {
        soundBomb();
        const bombMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const bombMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), bombMat);
        bombMesh.position.copy(npc.mesh.position);
        bombMesh.position.y += 0.3;
        const dir = new THREE.Vector3()
            .subVectors(carGroup.position, npc.mesh.position)
            .normalize();
        bombMesh.position.addScaledVector(dir, 2.0);
        scene.add(bombMesh);
        bombs.push({ mesh: bombMesh, direction: dir, velocityY: 0.5, life: 55, isNpc: true, ownerNpc: npc, exploded: false, speedMul: 2.5, isPlayerOwned: false });
        showShellWarning("💣 ボム兵が飛んでくる！", "#ff8800");
        return;
    }
    
    if (item === "キノコ3") { npc.boostTimer = 100; return; }
    if (item === "キノコ" || item === "金キノコ" || item === "デカキノコ" || item === "スター") {
        npc.boostTimer = 100; if (item === "デカキノコ") npc.isMega = 200; if (item === "スター") npc.isStar = 200;
    } else if (item === "赤甲羅") {
        const sm = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
        sm.position.copy(npc.mesh.position).y += 0.5; scene.add(sm);
        shells.push({ mesh: sm, type: "red_to_player", life: 350, velocityY: 0, isPlayerOwned: false });
        showShellWarning("🔴 赤甲羅が追ってくる！", "#ff3333");
    } else if (item === "青甲羅") {
        const sm = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x0066ff }));
        sm.position.copy(npc.mesh.position).y += 0.5;
        scene.add(sm);
        soundBlueShell();
        let target = getBlueShellTarget();
        let targetMesh = target === carGroup ? carGroup : target;
        shells.push({ 
            mesh: sm, 
            type: "blue", 
            target: targetMesh, 
            phase: "ascend", 
            height: 0, 
            targetY: 20, 
            speed: 3.5, 
            life: 1500, 
            velocityY: 0, 
            startPos: npc.mesh.position.clone(), 
            exploded: false, 
            fixedX: 0, 
            fixedZ: 0, 
            isPlayerOwned: false 
        });
        let targetName = (target === carGroup) ? "あなた" : "1位のNPC";
        showShellWarning(`💙 青甲羅発射！ (${targetName}狙い)`, "#0066ff");
    } else if (item === "サンダー") {
        if (itemMegaTimer <= 0 && itemStarTimer <= 0 && playerHitInvincibleTimer <= 0) {
            isSquishedTimer = 120; speed = 0; turboTimer = 0; isDrifting = false; driftCharge = 0; turboState = 0; itemMushroomTimer = 0; itemGoldenTimer = 0; soundHit();
            dropPlayerItems(); dropCoins(); playerHitInvincibleTimer = 180;
            const tx = document.getElementById("turbo-ui"); tx.innerText = "⚡ サンダーを喰らった！！"; tx.style.color = "#bb33ff";
        } else {
            const tx = document.getElementById("turbo-ui"); tx.innerText = "🛡️ サンダー無効化！"; tx.style.color = "#ffff00";
        }
        npcs.forEach(other => { if (other !== npc && other.isMega <= 0 && other.isStar <= 0) { dropNpcItems(other); other.isSquished = 120; other.boostTimer = 0; } });
    }
}

const carPos = carGroup.position;

function createExplosion(pos) {
    const sphereGeo = new THREE.SphereGeometry(6, 32, 16);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false });
    const dome = new THREE.Mesh(sphereGeo, sphereMat);
    dome.position.set(pos.x, 4, pos.z);
    dome.scale.y = 0.6;
    scene.add(dome);
    explosions.push({ mesh: dome, life: 1.0, isDome: true });
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 8, 48), ringMat);
    ring.position.set(pos.x, 0.1, pos.z);
    ring.rotation.x = -Math.PI / 2;
    scene.add(ring);
    explosions.push({ mesh: ring, life: 0.8, isDome: false });
    const light = new THREE.PointLight(0xffaa00, 10, 40);
    light.position.set(pos.x, 5, pos.z);
    scene.add(light);
    setTimeout(() => scene.remove(light), 300);
}

// ---------- メインアニメーション (FPS120対応) ----------
function animate(time) {
    if (time - lastFrameTime < FRAME_INTERVAL) {
        requestAnimationFrame(animate);
        return;
    }
    lastFrameTime = time;
    
    const turboText = document.getElementById("turbo-ui");
    const statusText = document.getElementById("status-text");
    const rankText = document.getElementById("rank-text");
    const lapText = document.getElementById("lap-text");
    const countdownEl = document.getElementById("countdown");
    const warningEl = document.getElementById("warning-text");

    // FPS
    frameCount++;
    const now = performance.now();
    if (now - lastFpsUpdate >= 1000) {
        currentFps = Math.round(frameCount * 1000 / (now - lastFpsUpdate));
        frameCount = 0;
        lastFpsUpdate = now;
    }
    let nearestDist = Infinity;
    let nearestNpc = null;
    let nearestPos = null;
    for (let i = 0; i < npcs.length; i++) {
        const d = carGroup.position.distanceTo(npcs[i].mesh.position);
        if (d < nearestDist) {
            nearestDist = d;
            nearestNpc = npcs[i];
            nearestPos = npcs[i].mesh.position.clone();
        }
    }
    // ★ 前後判定
    let dirText = "";
    if (nearestNpc && nearestPos) {
        const forward = new THREE.Vector3(-Math.sin(carGroup.rotation.y), 0, -Math.cos(carGroup.rotation.y));
        const toNpc = new THREE.Vector3().subVectors(nearestPos, carGroup.position);
        toNpc.y = 0;
        const dot = forward.dot(toNpc.normalize());
        if (dot > 0.3) dirText = "前";
        else if (dot < -0.3) dirText = "後ろ";
        else dirText = "横";
    }
    const nearestDistText = nearestDist === Infinity ? "---" : nearestDist.toFixed(1) + "m " + dirText;
    if (showDebugStats) {
        const el = document.getElementById("debug-stats");
        if (el) { el.textContent = `FPS: ${currentFps}  |  最寄NPC: ${nearestDistText}`; }
    }

    updateBombCharge();

    const prevJumping = isJumping;
    isJumping = (carY > 0.15 || jumpVelocity > 0.01);
    
    if (!isJumping && prevJumping) {
        if (jumpActionCountThisJump > 0) {
            let boostPower = 1.8;
            if (jumpActionCountThisJump >= 5) boostPower = 2.8;
            else if (jumpActionCountThisJump >= 4) boostPower = 2.5;
            else if (jumpActionCountThisJump >= 3) boostPower = 2.2;
            else if (jumpActionCountThisJump >= 2) boostPower = 2.0;
            turboTimer = Math.max(turboTimer, 15 + jumpActionCountThisJump * 5);
            speed = Math.max(speed, boostPower);
            soundBoost();
            turboText.innerText = `💨 着地ブースト！ (${jumpActionCountThisJump}回) 💨`;
            turboText.style.color = "#00ff66";
        }
        jumpActionCountThisJump = 0;
        canChargeJump = true;
        document.getElementById("jump-count").innerHTML = `✨ ジャンプ: ${jumpActionCount}回 (今回${jumpActionCountThisJump}回)`;
    }

    if (warningTimer > 0) { warningTimer--; warningEl.textContent = warningMessage; warningEl.style.color = warningColor; }
    else { warningEl.textContent = ""; }

    gearGroup.rotation.z += 0.008; alertLight.intensity = Math.sin(Date.now() * 0.01) * 0.8 + 0.8;
    if (playerHitInvincibleTimer > 0) playerHitInvincibleTimer--;

    // ★ Xキーで後ろ向き (カメラ反転) - 走行中でもブレずに真後ろを捉える
    if (lookBack) {
        cameraFlipCurrent = Math.PI;
    } else {
        cameraFlipCurrent = 0;
    }

    let camOffsetX = isDrifting ? -driftDir * 5.0 : 0;
    let relativeCameraOffset;
    if (lookBack) {
        // 後ろ向き確認時：カートから十分離して（Z: -24, Y: 7.0）引きの視点で全体を見渡せるように調整
        relativeCameraOffset = new THREE.Vector3(0, 7.0, -24.0);
    } else if (keys.s) {
        relativeCameraOffset = new THREE.Vector3(camOffsetX, 6.0, -15);
    } else {
        relativeCameraOffset = new THREE.Vector3(camOffsetX, 6.0, 15);
    }

    const targetCameraOffset = relativeCameraOffset.clone().applyMatrix4(carGroup.matrixWorld);
    currentCameraPos.lerp(targetCameraOffset, lookBack ? 0.2 : 0.08);
    camera.position.copy(currentCameraPos);
    camera.lookAt(new THREE.Vector3(carPos.x, carPos.y + 1.2, carPos.z));

    let inEntryZone = (carPos.x > -entryZoneGeo.parameters.width/2 && carPos.x < entryZoneGeo.parameters.width/2 && carPos.z > 80 && carPos.z < 140);

    if (raceState === 0) {
        rankText.innerText = "順位: 自由走行中"; lapText.innerText = "Lap: --";
        let targetText = inEntryZone ? "【E】キーで20周耐久レース開始！" : "黄色のエリアへ向かおう";
        if (targetText !== lastCenterText) { countdownEl.innerText = targetText; lastCenterText = targetText; centerUiTimer = 5000; }
        if (centerUiTimer > 0) { centerUiTimer -= 16.66; if (centerUiTimer <= 0) countdownEl.innerText = ""; }
        if (inEntryZone && keys.e) { keys.e = false; startRaceGridPlacement(); raceState = 1; countdownTime = 4000; rocketTimer = 0; rocketFailed = false; lastCenterText = ""; }
    } else if (raceState === 1) {
        countdownTime -= 16.66; let seconds = countdownTime / 1000; let secInt = Math.floor(seconds);
        if (seconds > 3) { countdownEl.innerText = "3"; if(lastSecondsInt !== 3){ soundCount(); lastSecondsInt = 3; } }
        else if (seconds > 2) { countdownEl.innerText = "2"; if(lastSecondsInt !== 2){ soundCount(); lastSecondsInt = 2; } if (keys.w) rocketTimer += 16.66; }
        else if (seconds > 1) { countdownEl.innerText = "1"; if(lastSecondsInt !== 1){ soundCount(); lastSecondsInt = 1; } if (keys.w && rocketTimer > 400) rocketFailed = true; }
        else if (seconds > 0) { countdownEl.innerText = "GO!!"; raceState = 2; soundGo();
            if (rocketTimer > 300 && rocketTimer < 950 && !rocketFailed) { turboTimer = 30; soundBoost(); turboText.innerText = "🚀 ロケットスタート！ 🚀"; }
            else if (rocketFailed) { speed = -0.2; turboTimer = -20; soundHit(); turboText.innerText = "💨 エンスト！ 💨"; }
        }
    } else if (raceState === 2) {
        if (countdownTime > -1000) { countdownTime -= 16.66; if (countdownTime <= 0) countdownEl.innerText = ""; }
    } else if (raceState === 3) {
        if (lastCenterText !== "FINISH!!") { countdownEl.innerText = "🏁 FINISH!! 🏁"; lastCenterText = "FINISH!!"; centerUiTimer = 5000; }
        if (centerUiTimer > 0) { centerUiTimer -= 16.66; if (centerUiTimer <= 0) countdownEl.innerText = ""; }
    }

    // --- 爆発エフェクト ---
    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.life -= 0.025;
        const scale = 1 + (1 - exp.life) * 3.0;
        if (exp.isDome) { exp.mesh.scale.set(scale, scale * 0.6, scale); }
        else { exp.mesh.scale.set(scale, scale, scale); exp.mesh.material.opacity = Math.max(0, exp.life * 0.9); }
        if (exp.life <= 0) { scene.remove(exp.mesh); explosions.splice(i, 1); }
    }

    // --- ファイヤーフラワー (重力付き) ---
    if (fireballCooldown > 0) fireballCooldown--;
    for (let i = fireballs.length - 1; i >= 0; i--) {
        const fb = fireballs[i];
        fb.life--;
        
        fb.vy = (fb.vy || 0) - (fb.gravity || 0.025);
        fb.mesh.position.x += fb.direction.x * fb.speed;
        fb.mesh.position.z += fb.direction.z * fb.speed;
        fb.mesh.position.y += fb.vy;
        
        if (fb.mesh.position.y < 0.2) {
            fb.mesh.position.y = 0.2;
            fb.vy = Math.abs(fb.vy) * 0.3;
            if (Math.abs(fb.vy) < 0.02) {
                fb.life = 0;
            }
        }
        
        if (fb.trail && fb.trail.length > 0) {
            fb.trailCounter = (fb.trailCounter + 1) % 3;
            if (fb.trailCounter === 0) {
                const t = fb.trail.shift();
                t.position.copy(fb.mesh.position);
                t.visible = true;
                t.material.opacity = 0.6;
                fb.trail.push(t);
            }
            fb.trail.forEach((t) => { t.material.opacity *= 0.94; if (t.material.opacity < 0.01) t.visible = false; });
        }
        
        const bx = fb.mesh.position.x; const bz = fb.mesh.position.z;
        if ((bx < -370 || bx > 370 || bz < -470 || bz > 470) && fb.bounces < fb.maxBounces) {
            if (bx < -370 || bx > 370) fb.direction.x *= -1;
            if (bz < -470 || bz > 470) fb.direction.z *= -1;
            fb.bounces++;
            fb.mesh.position.x = Math.max(-369, Math.min(369, bx));
            fb.mesh.position.z = Math.max(-469, Math.min(469, bz));
        }
        let shouldRemove = false;
        if (fb.life <= 0) shouldRemove = true;
        if (!shouldRemove) {
            for (let j = 0; j < npcs.length; j++) {
                const npc = npcs[j];
                const dist = fb.mesh.position.distanceTo(npc.mesh.position);
                if (dist < 3.5) {
                    if (fb.isNpc && fb.ownerNpc === npc) continue;
                    if (npc.isStar > 0 || npc.isMega > 0) continue;
                    if (npc.heldItem === "緑甲羅" || npc.heldItem === "赤甲羅") {
                        if (npc.heldItem) { spawnDroppedItem(npc.heldItem, npc.mesh.position); npc.heldItem = null; }
                        showShellWarning("🔥 ガード破壊！", "#ff6600");
                        shouldRemove = true; break;
                    }
                    npc.isSquished = 150; npc.boostTimer = 0;
                    const npcCoinDrop = Math.floor(Math.random() * 2) + 1;
                    for (let c = 0; c < npcCoinDrop; c++) { spawnDroppedItem("コイン", npc.mesh.position); }
                    soundHit();
                    turboText.innerText = `🔥 火の玉命中！`;
                    turboText.style.color = "#ff6600";
                    if (fb.isPlayerOwned) { showHitNotification("🔥 ファイヤーボールが命中！", "#ff6600"); }
                    shouldRemove = true; break;
                }
            }
        }
        if (!shouldRemove && fb.isNpc) {
            const distToPlayer = fb.mesh.position.distanceTo(carGroup.position);
            if (distToPlayer < 3.5) {
                if (itemStarTimer > 0 || itemMegaTimer > 0 || itemBulletTimer > 0) {
                    turboText.innerText = "🛡️ 無効化！";
                    turboText.style.color = "#ffff00";
                    shouldRemove = true;
                } else {
                    if (isItemShielding && shieldShellMesh) {
                        carGroup.remove(shieldShellMesh); shieldShellMesh = null; isItemShielding = false;
                        if (heldItems[0]) { spawnDroppedItem(heldItems[0], carGroup.position); heldItems[0] = null; }
                        showShellWarning("🔥 ガード破壊！", "#ff6600");
                        shouldRemove = true;
                    } else if (playerHitInvincibleTimer <= 0) {
                        isSquishedTimer = 150; speed = 0; turboTimer = 0; isDrifting = false; driftCharge = 0; turboState = 0;
                        itemMushroomTimer = 0; itemGoldenTimer = 0; playerHitInvincibleTimer = 180;
                        dropCoins(); soundHit();
                        turboText.innerText = "🔥 火の玉被弾！";
                        turboText.style.color = "#ff4400";
                        showShellWarning("🔥 被弾！", "#ff4400");
                        shouldRemove = true;
                    }
                }
            }
        }
        if (shouldRemove) {
            const smallExp = new THREE.Mesh(new THREE.SphereGeometry(1.5, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 }));
            smallExp.position.copy(fb.mesh.position); smallExp.position.y = 0.3;
            scene.add(smallExp);
            setTimeout(() => scene.remove(smallExp), 200);
            scene.remove(fb.mesh);
            if (fb.trail) { fb.trail.forEach(t => scene.remove(t)); }
            fireballs.splice(i, 1);
        }
    }

    // --- ボム兵 ---
    for (let i = bombs.length - 1; i >= 0; i--) {
        const bomb = bombs[i];
        bomb.life--;
        const spd = bomb.speedMul || 3.0;
        bomb.mesh.position.x += bomb.direction.x * spd;
        bomb.mesh.position.z += bomb.direction.z * spd;
        bomb.velocityY -= 0.04;
        bomb.mesh.position.y += bomb.velocityY;
        if (bomb.mesh.position.y < 0) { bomb.mesh.position.y = 0; bomb.velocityY = 0; }
        if (bomb.life <= 0 || bomb.mesh.position.y <= 0) {
            if (!bomb.exploded) {
                bomb.exploded = true;
                const pos = bomb.mesh.position.clone();
                createExplosion(pos);
                soundHit();
                const radius = 25;
                const distToPlayer = pos.distanceTo(carGroup.position);
                if (distToPlayer < radius) {
                    if (itemStarTimer > 0 || itemMegaTimer > 0 || itemBulletTimer > 0) {
                        turboText.innerText = "🛡️ 無効化！";
                        turboText.style.color = "#ffff00";
                    } else if (isItemShielding && shieldShellMesh) {
                        turboText.innerText = "🛡️ ガード！";
                        turboText.style.color = "#00ff88";
                        showShellWarning("🛡️ 爆発ガード！", "#00ff88");
                    } else if (playerHitInvincibleTimer <= 0) {
                        isSquishedTimer = 120; speed = 0; turboTimer = 0; isDrifting = false; driftCharge = 0; turboState = 0;
                        itemMushroomTimer = 0; itemGoldenTimer = 0; playerHitInvincibleTimer = 180;
                        dropCoins(); dropCoins();
                        turboText.innerText = "💥 爆発被弾！コイン-2";
                        turboText.style.color = "#ff8800";
                        showShellWarning("💥 爆発被弾！", "#ff8800");
                    }
                }
                npcs.forEach(npc => {
                    const d = pos.distanceTo(npc.mesh.position);
                    if (d < radius) {
                        if (npc.isMega <= 0 && npc.isStar <= 0) {
                            npc.isSquished = 180; npc.boostTimer = 0;
                            const npcCoinDrop = Math.floor(Math.random() * 2) + 1;
                            for (let c = 0; c < npcCoinDrop; c++) { spawnDroppedItem("コイン", npc.mesh.position); }
                            if (bomb.isPlayerOwned) { showHitNotification("💣 ボム兵の爆発が命中！", "#ff8800"); }
                        }
                    }
                });
            }
            scene.remove(bomb.mesh);
            bombs.splice(i, 1);
        }
        if (bomb.mesh.children.length > 0) {
            const fuse = bomb.mesh.children[0];
            if (fuse) {
                fuse.material.color.setHSL((Date.now() * 0.02) % 1, 1, 0.5);
                fuse.scale.set(1 + Math.sin(Date.now() * 0.1) * 0.3, 1 + Math.sin(Date.now() * 0.1 + 1) * 0.3, 1 + Math.sin(Date.now() * 0.1 + 2) * 0.3);
            }
        }
    }

    // --- 甲羅処理 ---
    for (let i = shells.length - 1; i >= 0; i--) {
        const shell = shells[i];
        shell.life--;
        if (shell.type !== "blue") {
            shell.velocityY = (shell.velocityY || 0) - 0.02;
            shell.mesh.position.y += shell.velocityY;
            if (shell.mesh.position.y < 0) { shell.mesh.position.y = 0; shell.velocityY = 0; }
        }
        if (shell.type === "green") {
            const spd = shell.speedMul || 3.5;
            shell.mesh.position.addScaledVector(shell.dir, spd);
            shell.mesh.rotation.y += 0.1;
        } else if (shell.type === "red" && shell.targetNpc) {
            const tPos = shell.targetNpc.mesh.position;
            const sDir = new THREE.Vector3().subVectors(tPos, shell.mesh.position); sDir.y = 0; sDir.normalize();
            shell.mesh.position.addScaledVector(sDir, 3.5);
            shell.mesh.lookAt(tPos.x, shell.mesh.position.y, tPos.z);
        } else if (shell.type === "red_to_player") {
            const tPos = carGroup.position;
            const sDir = new THREE.Vector3().subVectors(tPos, shell.mesh.position); sDir.y = 0; sDir.normalize();
            shell.mesh.position.addScaledVector(sDir, 3.5);
            shell.mesh.lookAt(tPos.x, shell.mesh.position.y, tPos.z);
            if (shell.mesh.position.distanceTo(carGroup.position) < 5.5) {
                if (isItemShielding) {
                    isItemShielding = false; if (shieldShellMesh) { carGroup.remove(shieldShellMesh); shieldShellMesh = null; }
                    heldItems[0] = heldItems[1]; heldItems[1] = null; updateItemUI(); soundHit();
                    turboText.innerText = "🛡️ ガード成功！";
                    turboText.style.color = "#00ff00";
                    showShellWarning("🛡️ 甲羅ガード！", "#00ff88");
                } else if (itemMegaTimer <= 0 && itemStarTimer <= 0 && itemBulletTimer <= 0) {
                    if (playerHitInvincibleTimer > 0) {
                        turboText.innerText = "🛡️ 無敵！";
                        turboText.style.color = "#33ffff";
                    } else {
                        isSquishedTimer = 90; speed = 0; turboTimer = 0; isDrifting = false; driftCharge = 0; turboState = 0;
                        itemMushroomTimer = 0; itemGoldenTimer = 0; playerHitInvincibleTimer = 180;
                        soundHit(); dropCoins();
                        turboText.innerText = "💥 被弾！";
                        turboText.style.color = "#ff3333";
                        showShellWarning("🔴 被弾！", "#ff3333");
                    }
                } else { turboText.innerText = "🛡️ 無効化！"; turboText.style.color = "#ffff00"; }
                shell.life = 0;
            }
        } else if (shell.type === "blue") {
            if (!shell.target || shell.exploded) { shell.life = 0; continue; }
            let targetPos = shell.target.position ? shell.target.position : shell.target.mesh.position;
            if (!targetPos) { shell.life = 0; continue; }
            if (shell.phase === "ascend") {
                let dx = targetPos.x - shell.mesh.position.x;
                let dz = targetPos.z - shell.mesh.position.z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                if (dist > 1.5) {
                    let move = Math.min(dist, shell.speed * 0.8);
                    shell.mesh.position.x += (dx / dist) * move;
                    shell.mesh.position.z += (dz / dist) * move;
                }
                shell.height += 0.6;
                shell.mesh.position.y = shell.height;
                if (shell.height >= shell.targetY) {
                    shell.phase = "descend";
                    shell.velocityY = 0.5;
                    shell.fixedX = targetPos.x;
                    shell.fixedZ = targetPos.z;
                }
            } else if (shell.phase === "descend") {
                if (shell.target) {
                    let tPos = shell.target.position ? shell.target.position : shell.target.mesh.position;
                    if (tPos) {
                        let dx = tPos.x - shell.fixedX;

        jumpActionTimer--;
        carModel.rotation.y += 0.35;
        carModel.rotation.x += jumpRotX;
        carModel.rotation.z += jumpRotZ;
        if (jumpActionTimer === 0) carModel.rotation.set(0, 0, 0);
    }

    if (!isWallRiding && itemBulletTimer <= 0) {
        if (carY > targetBaseY || jumpVelocity > 0) {
            carY += jumpVelocity; jumpVelocity -= 0.022;
            if (carY < targetBaseY) {
                carY = targetBaseY; jumpVelocity = 0;
                if (wallKickCount > 0) {
                    turboTimer = 15 + (wallKickCount * 12);
                    turboText.innerText = `💨 着地ブースト！ [壁キック:${wallKickCount}回]`;
                    turboText.style.color = "#00ff66";
                    wallKickCount = 0; hasJumpActioned = false; soundBoost();
                } else if (hasJumpActioned) {
                    turboTimer = pendingChargeTurbo; speed = Math.max(speed, pendingChargeSpeed);
                    turboText.innerText = pendingChargeMsg; turboText.style.color = pendingChargeColor;
                    soundBoost();
                    hasJumpActioned = false;
                }
            }
        }
        else { carY = THREE.MathUtils.lerp(carY, targetBaseY, 0.2); }
    }
    carGroup.position.y = carY;

    if (keys[" "] && carY <= 0.15 && isSquishedTimer <= 0 && itemBulletTimer <= 0 && !isWallRiding && poleSpinTimer <= 0 && canChargeJump) {
        jumpChargeTime = Math.min(jumpChargeTime + 1, 60);
    }

    if (raceState === 1 || isSquishedTimer > 0) { speed = 0; }
    else if (poleSpinTimer > 0) { speed = Math.max(speed, 1.8); }
    else if (itemBulletTimer > 0) { }
    else if (isWallRiding) { }
    else if (itemMushroomTimer > 0) { itemMushroomTimer--; speed = 3.0; }
    else if (itemGoldenTimer > 0) { speed = 3.0; }
    else if (itemStarTimer > 0) { speed = 2.8; }
    else if (turboTimer > 0) { turboTimer--; speed = Math.max(speed, 2.3); }
    else if (turboTimer < 0) { turboTimer++; speed = 0; }
    else {
        if (keys.w) speed = Math.min(speed + accel, maxSpeed);
        else if (keys.s) speed = Math.max(speed - accel, -maxSpeed / 2);
        else speed = speed > 0 ? Math.max(speed - decel, 0) : Math.min(speed + decel, 0);
    }

    let turnAngle = 0; let canDrift = (carY <= targetBaseY + 0.1 && !isWaterOn && !isWallRiding && poleSpinTimer <= 0 && itemBulletTimer <= 0);
    if (keys.v && !isDrifting && Math.abs(speed) > 0.4 && !keys.s && isSquishedTimer <= 0 && canDrift) { if (keys.d) { isDrifting = true; driftDir = 1; } else if (keys.a) { isDrifting = true; driftDir = -1; } }
    if (!keys.v && isDrifting) {
        isDrifting = false;
        if (turboState === 1) { turboTimer = 15; soundBoost(); turboText.innerText = "⚡ ミニターボ！"; turboText.style.color = "#00ffff"; }
        else if (turboState === 2) { turboTimer = 40; soundBoost(); turboText.innerText = "🔥 ウルトラミニターボ！！"; turboText.style.color = "#ff00ff"; }
        turboState = 0; driftCharge = 0;
    }
    if (isWallRiding) { turnAngle = 0; }
    else if (isDrifting && carY <= targetBaseY + 0.1 && poleSpinTimer <= 0) {
        let driftSteer = driftDir === 1 ? (keys.d ? 1.5 : (keys.a ? 0.3 : 0.8)) : (keys.a ? 1.5 : (keys.d ? 0.3 : 0.8));
        turnAngle = -0.024 * driftDir * driftSteer; driftCharge += driftSteer * 2.5;
        if (driftCharge > 100) { turboState = 2; } else if (driftCharge > 40) { turboState = 1; } else { turboState = 0; }
    } else if (poleSpinTimer <= 0 && itemBulletTimer <= 0) {
        if (Math.abs(speed) > 0.01 && raceState !== 1) { let sens = isWallRiding ? 0.012 : 0.034; if (keys.a) turnAngle = sens * (speed > 0 ? 1 : -1); if (keys.d) turnAngle = -sens * (speed > 0 ? 1 : -1); }
    }

    if (raceState !== 1) {
        let forwardVector = new THREE.Vector3(-Math.sin(carGroup.rotation.y), 0, -Math.cos(carGroup.rotation.y)).normalize();
        if (itemBulletTimer > 0) {
            bulletProgress += 0.0038;
            if (bulletProgress >= 1) { bulletProgress -= 1; playerLap++; if (playerLap > 20) { isFinished = true; raceState = 3; } }
            let p = bulletProgress;
            let segment = Math.floor(p * NODE_COUNT); let segmentPercent = (p * NODE_COUNT) % 1;
            let startNode = npcPathNodes[segment % NODE_COUNT]; let endNode = npcPathNodes[(segment + 1) % NODE_COUNT];
            let targetX = startNode.x + (endNode.x - startNode.x) * segmentPercent;
            let targetZ = startNode.z + (endNode.z - startNode.z) * segmentPercent;
            carGroup.position.set(targetX, 0.4, targetZ);
            let angle = Math.atan2(endNode.x - startNode.x, endNode.z - startNode.z);
            carGroup.rotation.y = angle;
            carGroup.scale.set(1.8, 1.8, 2.5);
            npcs.forEach(npc => {
                if (carGroup.position.distanceTo(npc.mesh.position) < 14.0 && npc.isSquished <= 0) {
                    npc.isSquished = 150;
                    npc.boostTimer = 0;
                    soundHit();
                    turboText.innerText = "🚀💥 キラーアタック！";
                    turboText.style.color = "#ff1111";
                }
            });
            if (itemBulletTimer === 0) {
                carGroup.scale.set(1, 1, 1);
                updatePlayerColor();
                carGroup.rotation.y = angle;
                turboTimer = 50;
                speed = 2.4;
            }
        } else {
            if (poleSpinTimer <= 0) { carGroup.rotation.y += turnAngle; }
            forwardVector = new THREE.Vector3(-Math.sin(carGroup.rotation.y), 0, -Math.cos(carGroup.rotation.y)).normalize();
            carGroup.position.addScaledVector(forwardVector, speed);
        }
        if (raceState === 2) {
            if (carPos.z < -300 && carPos.x > -100) midCheckpointPassed = true;
            if (midCheckpointPassed && Math.abs(carPos.x) < 40 && carPos.z > 40 && carPos.z < 62 && forwardVector.z < 0) {
                midCheckpointPassed = false;
                if (!isFinished) {
                    playerLap++;
                    coinsArray.forEach(c => { c.mesh.visible = true; c.collected = false; });
                    if (playerLap > 20) { isFinished = true; raceState = 3; }
                }
            }
            lapText.innerText = isFinished ? "Lap: FINISHED" : `Lap: ${playerLap}/20`;
            let myRank = getPlayerRank();
            rankText.innerText = `順位: ${myRank}位 / 12`;
        }
    }

    // ★ NPC更新 (速度バラバラ)
    npcs.forEach((npc, index) => {
        if (raceState === 2) {
            let nSpeed = (baseMaxSpeed * npc.topSpeedMul) / totalTrackLength;
            let playerProgressVal = playerLap + playerProgress;
            let npcProgressVal = npc.lap + npc.progress;
            if (npcProgressVal < playerProgressVal) {
                nSpeed += 0.00008 * npc.accelMul;
            }
            if (npc.isSquished > 0) { 
                npc.isSquished--; 
                nSpeed = 0.0001; 
                npc.mesh.scale.set(1.5, 0.1, 1.5); 
            } else { 
                npc.mesh.scale.set(1, 1, 1); 
                if (npc.boostTimer > 0) { 
                    npc.boostTimer--; 
                    nSpeed = (baseMaxSpeed * npc.topSpeedMul * 1.2) / totalTrackLength; 
                } 
            }
            if (npc.isCrashing) {
                nSpeed *= 0.6;
            }
            
            if (npc.isStar > 0) {
                npc.isStar--;
                if (npc.mesh.position.distanceTo(carGroup.position) < 7.0 && itemStarTimer <= 0 && itemMegaTimer <= 0 && isSquishedTimer <= 0 && playerHitInvincibleTimer <= 0) {
                    isSquishedTimer = 60; speed = 0; turboTimer = 0; isDrifting = false; driftCharge = 0; turboState = 0; itemMushroomTimer = 0; itemGoldenTimer = 0;
                    playerHitInvincibleTimer = 180; soundHit(); dropCoins();
                    turboText.innerText = "💥 スター衝突！";
                    turboText.style.color = "#ff3333";
                }
            }
            npc.progress += nSpeed; if (npc.progress >= 1) { npc.progress -= 1; npc.lap++; }
            if (npc.heldItem) { npc.itemUseTimer--; if (npc.itemUseTimer <= 0) { useNpcItem(npc); } }
        }
        let p = Math.max(0, npc.progress);
        let segment = Math.floor(p * NODE_COUNT); let segmentPercent = (p * NODE_COUNT) % 1;
        let startNode = npcPathNodes[segment % NODE_COUNT]; let endNode = npcPathNodes[(segment + 1) % NODE_COUNT];
        let npcX = startNode.x + (endNode.x - startNode.x) * segmentPercent;
        let npcZ = startNode.z + (endNode.z - startNode.z) * segmentPercent + ((index%2===0)?5:-5);
        let npcY = 0;
        if (npcX >= -80 && npcX <= 330 && npcZ > -460 && npcZ < -340) {
            let onBridge = (npcX >= -25 && npcX <= 25) || (npcX >= 100 && npcX <= 150) || (npcX >= 225 && npcX <= 275) || (npcX > 300);
            if (!onBridge) { npcY = 0; }
        }
        if (npc.mesh.position.y > 0.2) { npcY = npc.mesh.position.y; }
        npc.mesh.position.set(npcX + npc.velocityX * 0.5, npcY, npcZ + npc.velocityZ * 0.5);
        npc.velocityX *= 0.9;
        npc.velocityZ *= 0.9;
        if(npc.isMega > 0) { npc.isMega--; npc.mesh.scale.set(2.3, 2.3, 2.3); }
        npc.mesh.lookAt(endNode.x, 0, endNode.z);
    });

    // ★ 飛来物警告を更新 (青甲羅は中央小さく、それ以外は右上)
    updateIncomingWarnings();

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
// アニメーション開始
requestAnimationFrame(animate);
</script>
</body>
</html>
